buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RNKakaoLogins_' + name]
  }

  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    // Only pull in the Android Gradle Plugin when this library is built on its
    // own. Every consuming app necessarily supplies AGP from its own root
    // build.gradle, so declaring a second version here can only cause conflicts.
    if (project == rootProject) {
      classpath "com.android.tools.build:gradle:${getExtOrDefault('gradleVersion')}"
    }

    // The Kotlin plugin stays unconditional. Older consumer projects do not
    // always declare it at the root, and this classpath entry has been supplying
    // it for them. When the root does declare it, the root class loader wins and
    // the version below is ignored, which is why the previous 1.7.10 pin never
    // held consumers back.
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace 'com.dooboolab.kakaologins'
  compileSdk getExtOrDefault('compileSdkVersion').toInteger()

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion').toInteger()
    targetSdkVersion getExtOrDefault('targetSdkVersion').toInteger()
    versionCode 1
    versionName "1.0"
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lint {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion')}"

  // Kakao. Only the modules this library actually imports are declared:
  // `com.kakao.sdk.{common,auth,user}`. v2-talk / v2-story were dropped — no
  // source references them, and v2-story was pinned to 2.17.0 (discontinued),
  // which clashes with the 2.24.x line. Mirrors the iOS podspec, which depends
  // on KakaoSDKCommon / KakaoSDKAuth / KakaoSDKUser only.
  def kakaoVersion = getExtOrDefault('kakaoSdkVersion')
  implementation "com.kakao.sdk:v2-common:$kakaoVersion"
  implementation "com.kakao.sdk:v2-auth:$kakaoVersion"   // OAuthTokenRequest (OIDC nonce)
  implementation "com.kakao.sdk:v2-user:$kakaoVersion"   // 카카오 로그인
}

rootProject.allprojects {
  repositories {
    maven {
      // The Kakao SDK is not published to Maven Central, so consuming apps need
      // this repository to resolve com.kakao.sdk artifacts.
      url 'https://devrepo.kakao.com/nexus/content/groups/public/'
    }
  }
}
