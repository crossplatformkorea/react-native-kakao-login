name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-lib-project:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'yarn'

    - name: Install modules
      run: yarn install --frozen-lockfile

    - name: Lint & typecheck
      run: yarn validate

    - name: Build typescript & flow
      run: yarn build
